schema_version: 1

frameworks:
  sglang:
    version: "0.5.10"
    images:
      default: "lmsysorg/sglang:v0.5.10"
      cu130: "lmsysorg/sglang:v0.5.10-cu130"
    source_repo: "https://github.com/sgl-project/sglang.git"
  trtllm:
    version: "1.3.0rc10"
    images:
      default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc10"
    source_repo: "https://github.com/NVIDIA/TensorRT-LLM.git"
  vllm:
    version: "0.19.0"
    images:
      default: "vllm/vllm-openai:v0.19.0"
      cu130: "vllm/vllm-openai:v0.19.0-cu130"
    source_repo: "https://github.com/vllm-project/vllm.git"

profiles:
  step4_pro_latest:
    framework: vllm
    version: "0.19.0"
    package_version: "0.19.0.post20.dev26.gc820e5ae1"
    images:
      default: "hub.stepfun-inc.com/stepcast/stepcast:2026-08-06-server-vllm-test-0.19.0.post20.dev26.gc820e5ae1.precompiled"
    source_repo: "git@gitlab.basemind.com:sys/stepcast/vllm.git"
    source_commit: "607d1641ee3fec43653fca510d717725828890c2"

wideep:
  sglang:
    version: "0.5.10"
    images:
      default: "deepseek-v4-blackwell"
      grace_blackwell: "deepseek-v4-grace-blackwell"
    collector_dir: "collector/wideep/sglang"
    notes: >
      Requires an SGLang image with DeepSeek-V4/DeepEP modules; stock
      lmsysorg/sglang images may not include them.
  trtllm:
    version: "1.3.0rc10"
    images:
      default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc10"
    collector_dir: "collector/wideep/trtllm"
