# Example Experiment Configuration
# Based on QWEN3_32B analysis

exps:
  - custom_qwen_agg
  - custom_qwen_disagg

custom_qwen_agg:
  mode: "patch"
  serving_mode: "agg"
  model_name: "QWEN3_32B"
  system_name: "h200_sxm"
  total_gpus: 32
  isl: 4000
  osl: 500
  prefix: 0
  ttft: 300.0
  tpot: 10.0
  # Optional: prune search space
  config:
    worker_config:
      tp_list: [1, 2, 4, 8]
      pp_list: [1]

custom_qwen_disagg:
  mode: "patch"
  serving_mode: "disagg"
  model_name: "QWEN3_32B"
  system_name: "h200_sxm"
  total_gpus: 32
  isl: 4000
  osl: 500
  prefix: 0
  ttft: 300.0
  tpot: 10.0
  config:
    prefill_worker_config:
      tp_list: [1, 2, 4, 8]
      pp_list: [1]
    decode_worker_config:
      tp_list: [1, 2, 4, 8]
      pp_list: [1]
